services:
  db:
    build: ./db
    container_name: db
    ports:
      - "3307:5432"
    environment:
      POSTGRES_PASSWORD: "1234"
    volumes:
      - db_data:/var/lib/postgresql/15/main
    networks:
      - mynetwork
    

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - mynetwork
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mynetwork

volumes:
  db_data:
    driver: local

networks:
  mynetwork:
    external: true

