services:
  # ---------------------------------------------------------- data
  db:
    build: ./db
    container_name: transcendence-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_NAME: ${DB_NAME}
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [transcendence]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------- app
  backend:
    build: ./backend
    container_name: transcendence-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${PUBLIC_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SCHOOL42_CLIENT_ID: ${SCHOOL42_CLIENT_ID}
      SCHOOL42_CLIENT_SECRET: ${SCHOOL42_CLIENT_SECRET}
      RUSTBOX_API_KEY: ${RUSTBOX_API_KEY}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks: [transcendence]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
    container_name: transcendence-frontend
    environment:
      INTERNAL_BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    networks: [transcendence]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------- edge (HTTPS)
  nginx:
    build: ./nginx
    container_name: transcendence-nginx
    ports:
      - "8443:8443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [transcendence]
    restart: unless-stopped

  # ---------------------------------------------------------- monitoring
  prometheus:
    build: ./monitoring/prometheus
    container_name: transcendence-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on: [backend]
    networks: [transcendence]
    restart: unless-stopped

  alertmanager:
    build: ./monitoring/alertmanager
    container_name: transcendence-alertmanager
    environment:
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD}
    ports:
      - "127.0.0.1:9093:9093"
    networks: [transcendence]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: transcendence-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3005:3000"
    depends_on: [prometheus]
    networks: [transcendence]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: transcendence-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks: [transcendence]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: transcendence-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_PASSWORD}@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks: [transcendence]
    restart: unless-stopped

volumes:
  db_data:
  grafana_data:
  prometheus_data:

networks:
  transcendence:
    driver: bridge
