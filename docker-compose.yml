services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db
    ports:
      - "5432:5432"
    env_file:
      - ./db/.env
    volumes:
      - db_data:/var/lib/postgresql/15/main
    networks:
      - mynetwork

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend
    ports:
      - "1337:1337"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - mynetwork


  redis:
      build: ./redis
      container_name: redis
      restart: always
      env_file:
        - ./redis/.env
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      networks:
        - mynetwork


volumes:
  db_data:
  redis_data:

networks:
  mynetwork:
    external: true

