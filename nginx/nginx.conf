# Single HTTPS entrypoint for the whole platform.
#   /                     -> Next.js frontend
#   /api/auth/*           -> backend (better-auth)
#   /socket.io/*          -> backend (websockets, wss)
#   /user|/battle|...     -> backend REST
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend { server frontend:1337; }
upstream backend  { server backend:3000; }

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/transcendence.crt;
    ssl_certificate_key /etc/nginx/certs/transcendence.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Websockets (socket.io) — must reach the gateway with upgrade headers
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # better-auth + REST API
    location ~ ^/(api|user|users|battle|battles|challenge|challenges)(/|$) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
