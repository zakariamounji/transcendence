services:
  prometheus:
    build: ./prometheus
    container_name: prometheus
    networks:
      - mynetwork

  alertmanager:
    build: ./alertmanager
    container_name: alertmanager
    env_file:
      - ../.env
    networks:
      - mynetwork

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      # Bound to localhost only so external networks cannot access it
      - "127.0.0.1:3005:3000"
    env_file:
      - ../.env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mynetwork

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - mynetwork

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:/var/lib/docker:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    devices:
      - /dev/kmsg
    networks:
      - mynetwork

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    env_file:
      - ../.env
    environment:
      - DATA_SOURCE_URI=db:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=${EXPORTER_USER}
      - DATA_SOURCE_PASS=${EXPORTER_PASSWORD}
    volumes:
      - ./postgres-exporter/postgres_exporter.yml:/postgres_exporter.yml:ro
    networks:
      - mynetwork

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    env_file:
      - ../.env
    environment:
      - node.name=elasticsearch
      - cluster.name=elk-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - mynetwork

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: es-setup
    env_file:
      - ../.env
    depends_on:
      - elasticsearch
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Waiting for Elasticsearch security to come up..."
        until [ "$$(curl -s -o /dev/null -w '%{http_code}' -u "elastic:$${ELASTIC_PASSWORD}" http://elasticsearch:9200)" = "200" ]; do
          sleep 2
        done
        echo "Setting the kibana_system password..."
        curl -sS -f -u "elastic:$${ELASTIC_PASSWORD}" \
          -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}"
        echo "kibana_system password set."
    restart: "no"
    networks:
      - mynetwork

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    env_file:
      - ../.env
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    # Note: If external agents send logs to Logstash on port 5044, keep "127.0.0.1:5044:5044" or reverse-proxy it.
    depends_on:
      - elasticsearch
    networks:
      - mynetwork

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      # Bound to localhost only
      - "127.0.0.1:5601:5601"
    env_file:
      - ../.env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_ENCRYPTION_KEY}
    command:
      - /usr/local/bin/kibana-docker
      - --xpack.observabilityAIAssistant.enabled=false
    depends_on:
      es-setup:
        condition: service_completed_successfully
    networks:
      - mynetwork

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: kibana-setup
    env_file:
      - ../.env
    volumes:
      - ./kibana/export.ndjson:/export.ndjson:ro
    depends_on:
      - kibana
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Waiting for Kibana to come up..."
        until [ "$$(curl -s -o /dev/null -w '%{http_code}' -u "elastic:$${ELASTIC_PASSWORD}" http://kibana:5601/api/status)" = "200" ]; do
          sleep 2
        done
        echo "Importing Kibana saved objects..."
        curl -sS -f -u "elastic:$${ELASTIC_PASSWORD}" \
          -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
          -H "kbn-xsrf: true" \
          -F file=@/export.ndjson
        echo "Kibana saved objects imported."
    restart: "no"
    networks:
      - mynetwork

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: "0:0"
    command: ["-e", "--strict.perms=false"]
    env_file:
      - ../.env
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - mynetwork

networks:
  mynetwork:
    external: true

volumes:
  grafana_data:
  es_data:
  