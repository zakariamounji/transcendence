input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON formatted logs from backend/frontend if available
  if [type] == "docker" {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
  
  mutate {
    add_field => { "environment" => "production" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logs-%{+YYYY.MM.dd}"
  }
}
