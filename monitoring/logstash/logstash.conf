input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat's container input never sets [type], so the old `[type] == "docker"`
  # guard matched nothing and JSON log lines were stored as raw text. Detect the
  # payload directly instead, and decode into [app] so application keys cannot
  # collide with the ECS fields at the top level.
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  mutate {
    add_field => { "environment" => "production" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logs-%{+YYYY.MM.dd}"
  }
}
